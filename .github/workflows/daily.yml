name: daily-metrics

on:
  schedule:
    # GitHub 的 schedule 是 best-effort，高峰期会延迟甚至漏触发。
    # 多个冗余触发点 + 脚本内 DONE 标记防重：先到的跑，后到的自动跳过。
    - cron: "30 8 * * 1-5"   # 北京时间 16:30
    - cron: "0 9 * * 1-5"    # 北京时间 17:00
    - cron: "30 9 * * 1-5"   # 北京时间 17:30
    - cron: "0 11 * * 1-5"   # 北京时间 19:00
  workflow_dispatch:

concurrency:
  group: daily-metrics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      EMAIL_SOURCE_TAG: GitHub
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run A股 daily
        continue-on-error: true
        run: python run_daily.py

      - name: Run ETF daily
        continue-on-error: true
        run: python run_etf_daily.py

      - name: Run 港股 daily
        continue-on-error: true
        run: python run_hk_daily.py

      - name: Build buy list email
        continue-on-error: true
        run: python run_buy_daily.py

      - name: Run backtest
        continue-on-error: true
        run: python backtest.py

      - name: Build value screen
        continue-on-error: true
        run: python build_value.py

      - name: Build site
        if: always()
        run: python build_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Check daily completion
        run: |
          WEEKDAY=$(TZ=Asia/Shanghai date +%u)
          if [ "$WEEKDAY" -gt 5 ]; then
            echo "周末，跳过完成检查"
            exit 0
          fi
          TODAY=$(TZ=Asia/Shanghai date +%F)
          MISSING=""
          for d in output output_etf output_hk; do
            [ -s "$d/$TODAY/DONE" ] || MISSING="$MISSING $d"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下市场未完成(缺少 DONE 标记):$MISSING"
            exit 1
          fi
          echo "全部市场任务均已完成"

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output output_etf output_hk "摘要-*.md"
          if git diff --cached --quiet; then
            echo "没有新的输出需要提交"
          else
            git commit -m "daily results $(date +%Y-%m-%d)"
            git push
          fi
