name: daily-metrics

on:
  # ── 触发方式（2026-10 重做）───────────────────────────────────────────
  #
  # GitHub 的 `schedule` 是 best-effort，实测**延迟中位数 4.64 小时、最大 7.80 小时**
  # （对 52 次可归因的 daily-metrics 运行统计）。它根本不适合「收盘后尽快出数据」
  # 这个需求：北京的 16:30 触发点经常在次日 00:00~02:00 才开跑。
  #
  # 原来用「6 个 cron 互相补跑」来对冲延迟，代价是每天 6 次触发、其中 5 次只是
  # 撞上「今天已完成，跳过」—— 于是 Actions 历史里全是噪声，
  # 而真正的红灯（数据确实缺了）被淹没在里面。heartbeat.yml 又额外加了 4 次
  # 触发（它自己也是个 cron，同样被延迟），合计每天 10 次触发去追一个 4~8 小时的
  # 抖动。heartbeat 已删除。
  #
  # 现在：**主触发是外部的免费 cron 直接打 workflow_dispatch**（秒级启动，
  # 实测 createdAt == startedAt）。配置方法见 README「触发方式」一节。
  # workflow_dispatch 是唯一不受 schedule 抖动影响的入口，而它的触发时刻
  # 完全由我们决定 —— 这正是原来想要而 schedule 给不了的东西。
  #
  # 下面保留**一个** schedule 作为纯兜底：万一外部 cron 服务挂了/令牌过期，
  # 数据不至于整天不更新。它落在北京时间次日 01:00（A股 15:00、港股 16:00 都已
  # 收盘），且这一档实测最准时（延迟 0.04~0.70 小时）。
  # DONE 防重保证它与外部触发不会重复采集。
  schedule:
    - cron: "0 17 * * 1-5"   # 北京时间次日 01:00（唯一兜底，正常情况会被 DONE 跳过）
  workflow_dispatch:
    inputs:
      # 改完代码或回填完历史后，常常只想把站点重新构建部署一次，而不想再跑一遍
      # 采集（数据源被限流时那只会白白失败并把 run 判红）。
      mode:
        description: "full = 采集+构建+部署；site-only = 只重建并部署站点"
        type: choice
        options:
          - full
          - site-only
        default: full

concurrency:
  group: daily-metrics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Asia/Shanghai
  # schedule 触发时 inputs.mode 为空 -> 回退到 full
  MODE: ${{ inputs.mode || 'full' }}
  # 产物保留最近多少个交易日（prune_outputs.py 与 build_pages 共用同一数值，
  # 避免「站点宣称 120 天、仓库里只剩 30 天」的错位）
  DSM_KEEP_DAYS: "30"
  # 全局最小请求间隔（秒）。默认 0.05 ≈ 20 次/秒 —— 这是 CI 上**实测**出来的：
  # 8/16 并发 × 5 档节流共 920 次请求零失败，16 并发无节流实测 20.4 次/秒
  # （天花板 = 并发数 ÷ 单次延迟 0.74s，不是数据源的速率限制）。
  # 原来的 0.30（≈3.3 次/秒）是猜的，代价是 282 次 K 线请求的节流下限高达
  # 85 秒 —— 整轮最大的一块。详见 http_util.request_interval。
  DSM_REQUEST_INTERVAL: "0.05"
  # 每市场抓 K 线的并发数。它与上面那个间隔共同决定吞吐：
  # 间隔是上限，并发÷延迟是实际上限。16 → 20.4 次/秒（实测）。
  DSM_WORKERS: "16"
  # 「取名单」步骤的硬预算（秒）。实测 2026-10-09 三次 A 股运行里这一步花掉
  # 348s / 348s / 259s，而抓 113 只标的的指标只要 52s —— 名单只是成分，
  # 失败有观察池降级路径，所以超预算立刻降级，不再干等。见 http_util.list_deadline。
  DSM_LIST_DEADLINE_SEC: "45"

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EMAIL_SOURCE_TAG: GitHub
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 提交前要 git pull --rebase，浅克隆上会失败

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression tests
        run: |
          python tests/test_calendar.py
          python tests/test_workflows.py
          python tests/test_http_util.py
          python tests/test_kline_agg.py
          python tests/test_backtest.py
          python tests/test_degradation.py
          python tests/test_gate.py
          python tests/test_util.py

      # 目标日的**唯一**判断入口。输出 target_a/target_hk（应采集的交易日）与
      # expected_a/expected_hk（gate 要求必须存在 DONE 的交易日）。
      #
      # 为什么把「该采集哪天」和「该有哪天」分开：两者在盘中是不同的。
      # 10:00 时最新一根 K 线是今天的实时 bar，此时采集昨天会把今天写成昨天
      # （2026-10-02 那次脏数据就是这么来的），所以 collect=false；
      # 但「昨天」的 DONE 仍然必须存在，否则 gate 必须判红 —— 旧版把
      # 「跳过」和「通过」都当绿灯，这才是 8 天数据丢失却 Actions 全绿的根因。
      #
      # 这里**只**为 gate 推导 expected_*：采集步骤的开关不再由 workflow 判断，
      # 因为 runner 自己就会调 collection_target() 决定跑不跑、跑哪天 ——
      # 同一件事在 workflow 里再判一遍，就是第二份会漂移的判据。
      - name: Resolve target trading day
        id: target
        run: |
          python trading_calendar.py plan >> "$GITHUB_OUTPUT"
          # 同一步骤里 `${{ steps.target.outputs.* }}` 仍然是空的 —— 模板表达式在
          # 步骤开始前就求值了，那时 outputs 还没写。所以这里直接回显 plan 的结果
          # （而不是引用自己的 outputs，那会打印出「A/ETF= HK=」这种误导性空值）。
          python trading_calendar.py plan --json

      # 唯一的执行入口。本机 run.bat 调的是**同一个** run_all.py ——
      # 以前这里是 11 个内联步骤，而 run.bat 是另外 4 行，两者跑的不是同一件事
      # （本机不生成回测/价值标的/站点），于是「修好一处」只到得了其中一条。
      #
      # run_all.py 内部每一步都是独立子进程、各带自己的 DSM_DEADLINE_SEC
      # （http_util.DEFAULT_DEADLINE 是 import 时读一次的环境常量，
      # 放在同一个进程里就没法给不同步骤不同预算）。
      #
      # 退出码语义：**只有「构建站点」失败才返回非零**。其余步骤的成败交给
      # gate.py 裁决 —— 否则「一个市场被限流」会被放大成「整天产物作废」，
      # 这正是 2026-09-21~09-30 那 8 天数据丢失的形态。
      # 不写 continue-on-error：建站失败必须让这个 job 变红。
      - name: Run pipeline
        id: pipeline
        run: python run_all.py --mode "$MODE"

      # 无论是否完整都提交已成功的产出：旧版 Check 步骤先 exit 1，
      # 于是「一个市场失败」被放大成「当天全部产物丢失」，远端永远缺这一天
      # （2026-09-21~09-30 的 A 股其实天天跑成功，就是被这一步丢掉的）。
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 容错 add：任一 pathspec 无匹配时不能让整个提交步骤失败
          git add -A -- output output_etf output_hk 2>/dev/null || true
          # 用 if 而不是 `[ -e ] && git add`：后者在文件不存在时整条 AND-OR
          # 列表返回非零，配合 set -e 会让步骤直接中断。
          for f in 摘要-*.md; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "没有新的输出需要提交"
            exit 0
          fi
          git commit -m "daily results $(TZ=Asia/Shanghai date +%F)"
          # 手动补跑可能与外部 cron 触发重叠，push 前先 rebase
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet; then
              echo "提交成功（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，5s 后重试（$i/3）"
            sleep 5
          done
          echo "::error::push 连续失败，请检查分支保护或并发提交"
          exit 1

      # 诊断要留痕：fetch 层的重试明细以前只进 stdout，仓库里的 run_*.log
      # 只有三行，事后完全无法判断「重试了几次、哪个主机失败」。
      # run_all_summary.json 是各步骤的返回码与耗时 —— 一眼看出时间花在哪一步。
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            run_all_summary.json
            output/*/run_*.log
            output_etf/*/run_*.log
            output_hk/*/run_*.log
            output/*/failed_*.csv
            output_etf/*/failed_*.csv
            output_hk/*/failed_*.csv
          retention-days: 14
          if-no-files-found: ignore

      # 站点**总是**发布：缺哪个市场就在页面上显式挂警告条。
      # 旧版要求三个市场全部完成才部署，结果是「A股天天成功、ETF/港股被东财按 IP 拦」
      # 时站点整整三周停在 2026-09-18 —— 有数据却不给看，比缺一块更糟。
      #
      # 但部署必须以「站点构建成功」为前提：build_pages 会先 rmtree(docs) 再重建，
      # 中途崩溃会留下一个没有 index.html 的目录；如果照样部署，就会把
      # 上一次的好站点覆盖掉。outcome 判断保证失败时保留线上版本。
      - name: Setup Pages
        if: always() && steps.pipeline.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: always() && steps.pipeline.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always() && steps.pipeline.outcome == 'success'
        uses: actions/deploy-pages@v4

      # 唯一的红/绿裁决点。原来这里是**两段** bash：一段算出 complete、另一段
      # 据此决定退出码，而「哪些市场缺数据」的循环在别处还抄了第三份。现在收敛
      # 到 gate.py —— 它可以在本地直接跑，也能单测（见 tests/test_gate.py）。
      #
      # 它同时管两件事：
      #   1. 目标交易日必须有有效 DONE（瞬时抖动 → 下一个触发点补跑成功 → 绿；
      #      真正的缺陷 → 始终没有 DONE → 红）；
      #   2. **回看窗口内不能有空洞**。旧版只校验「最近一个交易日」，于是某天一旦
      #      永久丢失，它只在当天被判红，之后目标日往前滚动，那天再也不会被检查
      #      —— 缺口永远留在站点上而 CI 全绿。这正是 2026-09 静默停摆三周的同一
      #      类缺陷，只是窗口从三周缩到了一天。
      #
      # 空洞的判据锚在 metrics CSV 上而不是 DONE 的格式：DONE 在 2026-09-21 变过
      # 一次格式（旧版只有一个时间戳、19 字节），用 DONE 判空洞会把 08-21~09-18
      # 这 21 个旧格式日全部误判成缺失。
      - name: Completion gate
        if: always()
        env:
          TARGET_A: ${{ steps.target.outputs.expected_a }}
          TARGET_HK: ${{ steps.target.outputs.expected_hk }}
          MODE: ${{ env.MODE }}
          DSM_GATE_LOOKBACK: "5"
        run: python gate.py
