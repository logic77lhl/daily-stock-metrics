name: daily-metrics

on:
  schedule:
    # GitHub 的 schedule 是 best-effort。**实测延迟 4~8 小时**（不是 README 早期
    # 写的「几分钟到半小时」）：北京的 16:30 触发点经常在次日 00:00~02:00 才开跑。
    # 这一点以前是致命的 —— 跨过午夜后 `date +%F` 变成第二天，`hour < 15` 护栏
    # 判「未到收盘」直接跳过，而 gate 又把「跳过」当绿灯，于是整天数据静默丢失。
    # 现在目标日由 trading_calendar.collection_target() 按「最近一个已收盘且
    # 仍是最新一根 K 线的交易日」推导，跨午夜不再有歧义，晚到的触发点反而成了
    # 补跑窗口。多触发点 + DONE 防重：先到的跑，后到的自动跳过。
    - cron: "30 8 * * 1-5"   # 北京时间 16:30
    - cron: "0 9 * * 1-5"    # 北京时间 17:00
    - cron: "30 9 * * 1-5"   # 北京时间 17:30
    - cron: "0 11 * * 1-5"   # 北京时间 19:00
    - cron: "30 13 * * 1-5"  # 北京时间 21:30（实测这一档最常真正落地）
    - cron: "0 17 * * 1-5"   # 北京时间次日 01:00（跨午夜补跑窗口）
  workflow_dispatch:
    inputs:
      # 改完代码或回填完历史后，常常只想把站点重新构建部署一次，而不想再跑一遍
      # 采集（数据源被限流时那只会白白失败并把 run 判红）。
      mode:
        description: "full = 采集+构建+部署；site-only = 只重建并部署站点"
        type: choice
        options:
          - full
          - site-only
        default: full

concurrency:
  group: daily-metrics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Asia/Shanghai
  # schedule 触发时 inputs.mode 为空 -> 回退到 full
  MODE: ${{ inputs.mode || 'full' }}
  # 产物保留最近多少个交易日（prune_outputs.py 与 build_pages 共用同一数值，
  # 避免「站点宣称 120 天、仓库里只剩 30 天」的错位）
  DSM_KEEP_DAYS: "30"
  # 全局最小请求间隔（秒）。8 线程 × 每标的 3 个周期，不节流约 50 次/秒 ——
  # 实测会把腾讯打到限流（响应变非 JSON），随后整批标的失败。
  # 0.30 秒 ≈ 3.3 次/秒；想更保守就调大（代价是运行时间变长）。
  DSM_REQUEST_INTERVAL: "0.30"

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EMAIL_SOURCE_TAG: GitHub
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 提交前要 git pull --rebase，浅克隆上会失败

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression tests
        run: |
          python tests/test_calendar.py
          python tests/test_workflows.py
          python tests/test_http_util.py
          python tests/test_buy_list.py
          python tests/test_backtest.py
          python tests/test_degradation.py

      # 目标日的**唯一**判断入口。输出 target_a/target_hk（应采集的交易日）、
      # expected_a/expected_hk（gate 要求必须存在 DONE 的交易日）与 collect_* 开关。
      #
      # 为什么把「该采集哪天」和「该有哪天」分开：两者在盘中是不同的。
      # 10:00 时最新一根 K 线是今天的实时 bar，此时采集昨天会把今天写成昨天
      # （2026-10-02 那次脏数据就是这么来的），所以 collect=false；
      # 但「昨天」的 DONE 仍然必须存在，否则 gate 必须判红 —— 旧版把
      # 「跳过」和「通过」都当绿灯，这才是 8 天数据丢失却 Actions 全绿的根因。
      - name: Resolve target trading day
        id: target
        run: |
          python trading_calendar.py plan >> "$GITHUB_OUTPUT"
          # 同一步骤里 `${{ steps.target.outputs.* }}` 仍然是空的 —— 模板表达式在
          # 步骤开始前就求值了，那时 outputs 还没写。所以这里直接回显 plan 的结果
          # （而不是引用自己的 outputs，那会打印出「A/ETF= HK=」这种误导性空值）。
          python trading_calendar.py plan --json

      - name: Run A股 daily
        if: env.MODE != 'site-only' && steps.target.outputs.collect_a == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "2700"
        run: python run_daily.py

      - name: Run ETF daily
        if: env.MODE != 'site-only' && steps.target.outputs.collect_a == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "2700"
        run: python run_etf_daily.py

      - name: Run 港股 daily
        if: env.MODE != 'site-only' && steps.target.outputs.collect_hk == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "1500"
        run: python run_hk_daily.py

      - name: Build buy list email
        if: env.MODE != 'site-only' && steps.target.outputs.collect_a == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "600"
        run: python run_buy_daily.py

      - name: Run backtest
        if: env.MODE != 'site-only' && steps.target.outputs.collect_a == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "600"
        run: python backtest.py

      - name: Build value screen
        if: env.MODE != 'site-only' && steps.target.outputs.collect_a == 'true'
        continue-on-error: true
        env:
          DSM_DEADLINE_SEC: "600"
        run: python build_value.py

      # 这里曾经有一个「3 轮重试未完成市场」的步骤（每轮 sleep 180，最多再全量
      # 重采 9 次）。它被**删除**了，因为实测它一次都没救回过运行：
      #
      #   抽样 3 个失败运行，全部是「第 1 轮重试后仍缺 → 第 2 轮重试后仍缺」。
      #   原因很直接 —— 东财对云厂商出口 IP 的 RST 是**整批、按主机**的，
      #   实测同一分钟 4 个主机同时 RemoteDisconnected，而封禁窗口约 10 分钟。
      #   重试步骤的 sleep 180 就落在这同一个窗口里，注定撞同一堵墙。
      #
      # 真正有效的是**跨 cron 重试**：同一个封禁窗口过去后再跑一次就成功了。
      # 实测证据（按天的成功/失败序列）：
      #   09-21  XXOOOO   09-24  XXXXXO   09-25  XXXXXO   09-29  XXOOOO
      # 前几次失败、后面必然成功 —— 这不是"经常出错"，而是同一个瞬时故障被
      # 6 个 cron 放大成了十几次红灯。删掉 CI 内重试后，失败运行从 5~10 分钟
      # 降到 2 分钟以内，而成功率不受影响（机会留给下一个 cron）。
      #
      # 注意：fetch 层本身**仍然**有快速失败与主机退役（http_util.HostPool），
      # 所以单次运行不会再去烧 153 秒 × 4 主机的退避。两者是不同的层次：
      # 进程内快速放弃，跨 cron 择时重试。

      # 裁剪要在 Build site 之前：站点按最终存在的目录生成归档页，
      # 否则 docs 里会有指向「已被裁掉的报告」的死链。
      - name: Prune outputs
        if: always()
        run: python prune_outputs.py

      - name: Build site
        id: build
        if: always()
        env:
          DSM_DEADLINE_SEC: "300"
          TARGET_A: ${{ steps.target.outputs.expected_a }}
          TARGET_HK: ${{ steps.target.outputs.expected_hk }}
        run: python build_pages.py

      # 完成检查只产出结论，不在这里退出：真正的红/绿由最后的 gate 决定，
      # 这样「已成功市场的产出先提交」与「整体判红」不再互斥。
      #
      # 关键：**没有「非交易日 → 放行」这条分支了**。expected_* 永远是真实的
      # 交易日，节假日时它等于节前最后一个交易日 —— 那天的 DONE 早就存在，
      # 所以节假日自动绿灯；而「因为跨午夜/接口故障而没跑」会实打实地判红。
      - name: Check daily completion
        id: completion
        if: always()
        env:
          TARGET_A: ${{ steps.target.outputs.expected_a }}
          TARGET_HK: ${{ steps.target.outputs.expected_hk }}
        run: |
          MISSING=""
          for pair in "output:${TARGET_A}" "output_etf:${TARGET_A}" "output_hk:${TARGET_HK}"; do
            d="${pair%%:*}"; day="${pair##*:}"
            if [ -z "$day" ]; then
              echo "::error::$d 无法确定目标交易日"
              MISSING="$MISSING $d@?"
              continue
            fi
            if ! python quality.py check "$d/$day/DONE"; then
              MISSING="$MISSING $d@$day"
            fi
          done
          if [ -n "$MISSING" ]; then
            if [ "$MODE" = "site-only" ]; then
              # site-only 是**显式**的「只重建站点」，本轮根本没尝试采集，
              # 所以缺数据不算失败（站点首页的红色横幅仍然会如实列出）。
              # 注意这与旧版「把跳过当绿灯」的区别：那是**意外**跳过、
              # 且没有任何人知道；这里是用户主动选择、且页面上可见。
              echo "::warning::site-only 模式：以下市场缺目标交易日数据（未尝试采集）:$MISSING"
              echo "complete=n/a" >> "$GITHUB_OUTPUT"
              echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
            else
              echo "::error::以下市场在目标交易日缺有效 DONE:$MISSING"
              echo "complete=false" >> "$GITHUB_OUTPUT"
              echo "missing=$MISSING" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "全部市场在目标交易日均已完成"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          fi

      # 无论是否完整都提交已成功的产出：旧版 Check 步骤先 exit 1，
      # 于是「一个市场失败」被放大成「当天全部产物丢失」，远端永远缺这一天
      # （2026-09-21~09-30 的 A 股其实天天跑成功，就是被这一步丢掉的）。
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 容错 add：任一 pathspec 无匹配时不能让整个提交步骤失败
          git add -A -- output output_etf output_hk 2>/dev/null || true
          # 用 if 而不是 `[ -e ] && git add`：后者在文件不存在时整条 AND-OR
          # 列表返回非零，配合 set -e 会让步骤直接中断。
          for f in 摘要-*.md; do
            if [ -e "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "没有新的输出需要提交"
            exit 0
          fi
          git commit -m "daily results $(TZ=Asia/Shanghai date +%F)"
          # 手动补跑可能与定时任务或 heartbeat 补触发重叠，push 前先 rebase
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet; then
              echo "提交成功（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，5s 后重试（$i/3）"
            sleep 5
          done
          echo "::error::push 连续失败，请检查分支保护或并发提交"
          exit 1

      # 诊断要留痕：fetch 层的重试明细以前只进 stdout，仓库里的 run_*.log
      # 只有三行，事后完全无法判断「重试了几次、哪个主机失败」。
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            output/*/run_*.log
            output_etf/*/run_*.log
            output_hk/*/run_*.log
            output/*/failed_*.csv
            output_etf/*/failed_*.csv
            output_hk/*/failed_*.csv
          retention-days: 14
          if-no-files-found: ignore

      # 站点**总是**发布：缺哪个市场就在页面上显式挂警告条。
      # 旧版要求三个市场全部完成才部署，结果是「A股天天成功、ETF/港股被东财按 IP 拦」
      # 时站点整整三周停在 2026-09-18 —— 有数据却不给看，比缺一块更糟。
      #
      # 但部署必须以「站点构建成功」为前提：build_pages 会先 rmtree(docs) 再重建，
      # 中途崩溃会留下一个没有 index.html 的目录；如果照样部署，就会把
      # 上一次的好站点覆盖掉。outcome 判断保证失败时保留线上版本。
      - name: Setup Pages
        if: always() && steps.build.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: always() && steps.build.outcome == 'success'
        uses: actions/deploy-pages@v4

      # 唯一的红/绿裁决点。瞬时抖动 → Retry 补跑成功 → DONE 有效 → 绿；
      # 真正的缺陷（或跨午夜静默跳过）→ 目标交易日始终没有 DONE → 红。
      - name: Enforce completion gate
        if: always()
        run: |
          if [ "${{ steps.completion.outputs.complete }}" = "true" ]; then
            echo "全部市场完成，通过"
            exit 0
          fi
          if [ "${{ steps.completion.outputs.complete }}" = "n/a" ]; then
            echo "site-only 模式：未尝试采集，跳过完成门（缺数据已在站点横幅上标出）"
            exit 0
          fi
          echo "::error::目标交易日 A/ETF=${{ steps.target.outputs.expected_a }} HK=${{ steps.target.outputs.expected_hk }} 仍有市场未完成：${{ steps.completion.outputs.missing }}"
          exit 1
