name: markets-hk

on:
  schedule:
    # UTC 08:20 = 北京时间 16:20（港股 16:00 收盘后）
    - cron: "20 8 * * 1-5"
  workflow_dispatch:

concurrency:
  group: markets-hk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-hk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      EMAIL_SOURCE_TAG: GitHub
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 港股 daily
        continue-on-error: true
        run: python run_hk_daily.py

      - name: Check 港股 completion
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          if [ -s "output_hk/$TODAY/DONE" ]; then
            echo "港股任务已完成"
          else
            echo "::error::港股未完成(缺少 DONE 标记): output_hk"
            exit 1
          fi

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output_hk "摘要-港股.md"
          if git diff --cached --quiet; then
            echo "没有新的输出需要提交"
          else
            git commit -m "daily results $(date +%Y-%m-%d) 港股"
            git pull --rebase origin main || true
            git push
          fi