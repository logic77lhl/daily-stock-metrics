name: markets-aetf

on:
  schedule:
    # UTC 07:10 = 北京时间 15:10（A股/ETF 收盘后）
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: markets-aetf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-aetf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      EMAIL_SOURCE_TAG: GitHub
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run A股 daily
        continue-on-error: true
        run: python run_daily.py

      - name: Run ETF daily
        continue-on-error: true
        run: python run_etf_daily.py

      - name: Check A股/ETF completion
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          MISSING=""
          for d in output output_etf; do
            [ -s "$d/$TODAY/DONE" ] || MISSING="$MISSING $d"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::A股/ETF 未完成(缺少 DONE 标记):$MISSING"
            exit 1
          fi
          echo "A股/ETF 任务均已完成"

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output output_etf "摘要-A股.md" "摘要-ETF.md"
          if git diff --cached --quiet; then
            echo "没有新的输出需要提交"
          else
            git commit -m "daily results $(date +%Y-%m-%d) A股/ETF"
            git pull --rebase origin main || true
            git push
          fi